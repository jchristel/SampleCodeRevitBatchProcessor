# bundle title
title: "Report Area Lines with Warnings"

# bundle tooltip
tooltip: | 
  Lists all area lines with warnings:
  - area scheme they belong to
  - the level they are placed on
  To make it easier to find them in the model.


# bundle author
author: 
  - Jan Christel


