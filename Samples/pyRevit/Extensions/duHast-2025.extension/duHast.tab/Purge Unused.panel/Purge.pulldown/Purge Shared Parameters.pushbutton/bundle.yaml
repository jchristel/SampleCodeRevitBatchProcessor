# bundle title
title: "Shared Parameters"

# bundle tooltip
tooltip: | 
    Purges unused shared parameters from the model. 
    Warning this process can take mutlitple hours to finish depending on the number of families and shared parameters in the model!
    ( This process will attempt to delete every shared parameter in the model. If Revit reports more than 1 change, i.e. a family has changed when 
    the parameter was deleted, the action will be undone. This is however a very time consuming process.)



# bundle author
author: 
  - Jan Christel


