<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Room Plan</title>
<style>
  :root {
    --paper: #f3efe6;
    --ink: #1f2421;
    --rule: #cfc7b4;
    --fill: #e4ddc9;
    --fill-hover: #d4c9a8;
    --accent: #b4541f;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    display: grid;
    grid-template-rows: auto 1fr;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid var(--ink);
  }
  header h1 {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin: 0;
  }
  header .meta {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--accent);
  }
  header .meta.stale { color: var(--ink); opacity: 0.5; }

  /* --- project / building / level pickers, all in the header row --- */
  header select.picker {
    font-family: var(--mono);
    font-size: 0.72rem;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--ink);
    padding: 0.25rem 0.5rem;
  }
  header select.picker.hidden { display: none; }

  main { position: relative; overflow: hidden; }

  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg:active { cursor: grabbing; }

  .grid line { stroke: var(--rule); stroke-width: 0.5; vector-effect: non-scaling-stroke; }

  .room { fill: var(--fill); stroke: var(--ink); stroke-width: 1.5;
          stroke-linejoin: round; transition: fill 0.12s ease; vector-effect: non-scaling-stroke; }
  .room:hover { fill: var(--fill-hover); }
  .hole { fill: var(--paper); stroke: var(--ink); stroke-width: 1;
          stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }

  .label { fill: var(--ink); text-anchor: middle;
           dominant-baseline: middle; pointer-events: none; }
  .label .tag { fill: var(--accent); letter-spacing: 0.05em; }

  .empty {
    position: absolute; inset: 0; display: grid; place-content: center;
    text-align: center; gap: 0.4rem; color: var(--ink);
  }
  .empty strong { font-weight: 600; letter-spacing: 0.05em; }
  .empty span { font-size: 0.75rem; opacity: 0.6; }
  .empty code { background: #0001; padding: 0.1rem 0.4rem; }
  .hidden { display: none; }
</style>
</head>
<body>
  <header>
    <h1>Room Plan</h1>
    <select class="picker hidden" id="projectSelect"></select>
    <select class="picker hidden" id="buildingSelect"></select>
    <select class="picker hidden" id="levelSelect"></select>
    <span class="meta" id="meta">waiting for data</span>
  </header>
  <main>
    <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="empty" id="empty">
      <strong>No rooms received yet</strong>
      <span>POST your room JSON to <code>/rooms</code> from Revit, then this updates.</span>
    </div>
  </main>

<script>
const SVG = "http://www.w3.org/2000/svg";
const plan = document.getElementById("plan");
const meta = document.getElementById("meta");
const empty = document.getElementById("empty");
const projectSelect = document.getElementById("projectSelect");
const buildingSelect = document.getElementById("buildingSelect");
const levelSelect = document.getElementById("levelSelect");

// --- view transform state ---
let view = { x: 0, y: 0, w: 100, h: 100 };
let fitted = { x: 0, y: 0, w: 100, h: 100 };
let lastPayloadJson = null;

// --- level state ---
let currentPayload = null;   // last rendered payload
let activeLevelId = null;    // which level is shown

// --- scope state: which project/building /rooms is currently fetching ---
let currentProjectId = null;
let currentBuildingKey = null;    // opaque key from /projects/{id}/buildings; null = no filter
let lastProjectIds = null;        // for diffing the periodic /projects refresh
let lastBuildingsSignature = null;

async function fetchJson(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`${url} -> ${res.status}`);
  return res.json();
}

function setViewBox() {
  plan.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
}

function flip(p) { return { x: p.x, y: -p.y }; }

function bounds(rooms) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const r of rooms)
    for (const loop of r.loops)
      for (const raw of loop.points) {
        const p = flip(raw);
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
  if (!isFinite(minX)) return null;
  return { minX, minY, maxX, maxY };
}

function loopBox(loop) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const raw of loop.points) {
    const p = flip(raw);
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x;
    if (p.y > maxY) maxY = p.y;
  }
  return { w: maxX - minX, h: maxY - minY };
}

function pointsAttr(loop) {
  return loop.points.map(raw => { const p = flip(raw); return `${p.x},${p.y}`; }).join(" ");
}

function centroid(loop) {
  const pts = loop.points.map(flip);
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    const cross = p.x * q.y - q.x * p.y;
    a += cross; cx += (p.x + q.x) * cross; cy += (p.y + q.y) * cross;
  }
  if (Math.abs(a) < 1e-9) {
    const n = pts.length;
    return { x: pts.reduce((s, p) => s + p.x, 0) / n, y: pts.reduce((s, p) => s + p.y, 0) / n };
  }
  a *= 0.5;
  return { x: cx / (6 * a), y: cy / (6 * a) };
}

// Build the ordered list of levels to show. Prefer the payload's `levels`
// array (ordered by elevation on the server); fall back to deriving from
// rooms if an older payload omits it.
function levelsForPayload(payload) {
  if (Array.isArray(payload.levels) && payload.levels.length) {
    return payload.levels.slice().sort((a, b) => a.elevation - b.elevation);
  }
  const seen = new Map();
  for (const r of payload.rooms || []) {
    const id = r.level_id || "unknown";
    if (!seen.has(id)) seen.set(id, { id, name: id, elevation: 0 });
  }
  return [...seen.values()];
}

function roomsOnLevel(payload, levelId) {
  return (payload.rooms || []).filter(r => (r.level_id || "unknown") === levelId);
}

// Draw a single level's rooms and re-fit the view to them.
function renderLevel(payload, levelId, { refit = true } = {}) {
  plan.replaceChildren();
  const rooms = roomsOnLevel(payload, levelId);

  if (rooms.length === 0) {
    // a level with no placed rooms — clear canvas, leave a note in the meta
    if (refit) { view = { ...fitted }; setViewBox(); }
    return;
  }

  const b = bounds(rooms);
  if (!b) return;

  const w = b.maxX - b.minX, h = b.maxY - b.minY;
  const pad = Math.max(w, h) * 0.04 || 1;

  if (refit) {
    fitted = { x: b.minX - pad, y: b.minY - pad, w: w + 2 * pad, h: h + 2 * pad };
    view = { ...fitted };
    setViewBox();
  }

  const baseFont = Math.max(fitted.w, fitted.h) * 0.02;

  const g = document.createElementNS(SVG, "g");
  g.setAttribute("class", "grid");
  const step = 5;
  for (let gx = Math.ceil(fitted.x / step) * step; gx < fitted.x + fitted.w; gx += step)
    g.appendChild(line(gx, fitted.y, gx, fitted.y + fitted.h));
  for (let gy = Math.ceil(fitted.y / step) * step; gy < fitted.y + fitted.h; gy += step)
    g.appendChild(line(fitted.x, gy, fitted.x + fitted.w, gy));
  plan.appendChild(g);

  for (const room of rooms) {
    if (!room.loops || room.loops.length === 0) continue;

    const outer = document.createElementNS(SVG, "polygon");
    outer.setAttribute("points", pointsAttr(room.loops[0]));
    outer.setAttribute("class", "room");
    outer.appendChild(titleEl(room.name || room.id));
    plan.appendChild(outer);

    for (let i = 1; i < room.loops.length; i++) {
      const hole = document.createElementNS(SVG, "polygon");
      hole.setAttribute("points", pointsAttr(room.loops[i]));
      hole.setAttribute("class", "hole");
      plan.appendChild(hole);
    }

    addLabel(room, baseFont);
  }
}

function addLabel(room, baseFont) {
  const box = loopBox(room.loops[0]);
  const name = room.name || "(unnamed)";
  const widthLimited = (box.w * 0.9) / Math.max(name.length, 1) / 0.6;
  const heightLimited = box.h * 0.4;
  const fontSize = Math.min(baseFont, widthLimited, heightLimited);
  if (fontSize < baseFont * 0.25) return;

  const c = centroid(room.loops[0]);
  const label = document.createElementNS(SVG, "text");
  label.setAttribute("class", "label");
  label.setAttribute("x", c.x);
  label.setAttribute("y", c.y);
  label.setAttribute("font-size", fontSize);

  const nameSpan = document.createElementNS(SVG, "tspan");
  nameSpan.textContent = name;
  nameSpan.setAttribute("x", c.x);

  const tag = document.createElementNS(SVG, "tspan");
  tag.setAttribute("class", "tag");
  tag.setAttribute("x", c.x);
  tag.setAttribute("dy", "1.2em");
  tag.setAttribute("font-size", fontSize * 0.7);
  tag.textContent = room.id;

  label.append(nameSpan, tag);
  plan.appendChild(label);
}

function line(x1, y1, x2, y2) {
  const l = document.createElementNS(SVG, "line");
  l.setAttribute("x1", x1); l.setAttribute("y1", y1);
  l.setAttribute("x2", x2); l.setAttribute("y2", y2);
  return l;
}
function titleEl(text) {
  const t = document.createElementNS(SVG, "title");
  t.textContent = text;
  return t;
}

// Populate the level picker, highest elevation first (a <select> has no
// CSS-driven reversal the old floor-stack relied on, so sort explicitly here;
// `levelsForPayload`'s own ascending order — used elsewhere for the default
// "lowest level" selection — is untouched).
function buildLevelControl(payload, levels) {
  levelSelect.replaceChildren();
  const ordered = levels.slice().sort((a, b) => b.elevation - a.elevation);
  for (const lvl of ordered) {
    const count = roomsOnLevel(payload, lvl.id).length;
    const opt = document.createElement("option");
    opt.value = lvl.id;
    opt.textContent = `${lvl.name} (${count} rm)`;
    if (lvl.id === activeLevelId) opt.selected = true;
    levelSelect.appendChild(opt);
  }
  levelSelect.classList.toggle("hidden", levels.length <= 1);
}

function selectLevel(levelId) {
  if (!currentPayload) return;
  activeLevelId = levelId;
  renderLevel(currentPayload, levelId, { refit: true });
  updateMeta();
}
levelSelect.addEventListener("change", () => selectLevel(levelSelect.value));

// --- project / building pickers ---

function populateProjectSelect(projects) {
  const prevValue = projectSelect.value;
  projectSelect.replaceChildren();
  for (const p of projects) {
    const opt = document.createElement("option");
    opt.value = p.id;
    opt.textContent = p.name;
    projectSelect.appendChild(opt);
  }
  projectSelect.classList.toggle("hidden", projects.length <= 1);
  if (projects.some(p => p.id === prevValue)) projectSelect.value = prevValue;
}

function populateBuildingSelect(data) {
  const prevValue = buildingSelect.value;
  buildingSelect.replaceChildren();
  for (const b of data.buildings) {
    const opt = document.createElement("option");
    opt.value = b.key;
    opt.textContent = b.unclassified ? "Unclassified" : (b.name || b.code || b.key);
    buildingSelect.appendChild(opt);
  }
  buildingSelect.classList.toggle("hidden", data.buildings.length <= 1);
  if (data.buildings.some(b => b.key === prevValue)) buildingSelect.value = prevValue;
}

// Fetch the known projects; auto-select if there's exactly one and the
// current selection (if any) no longer exists. Diffs against the last-seen
// id list so it doesn't fight an in-progress user selection every tick.
async function loadProjects() {
  let projects;
  try {
    projects = await fetchJson("/projects");
  } catch (err) {
    return; // leave the current selection alone; poll() reports connection loss
  }
  const ids = projects.map(p => p.id).join(",");
  if (ids === lastProjectIds) return;
  lastProjectIds = ids;
  populateProjectSelect(projects);

  if (!projects.some(p => p.id === currentProjectId)) {
    currentProjectId = projects.length ? projects[0].id : null;
    lastBuildingsSignature = null; // force a buildings refresh for the new project
  }
  if (currentProjectId) await loadBuildingsForProject(currentProjectId);
}

// Fetch the buildings within one project; auto-select if there's exactly one
// (or none configured at all, meaning "everything in this project").
async function loadBuildingsForProject(projectId) {
  let data;
  try {
    data = await fetchJson(`/projects/${encodeURIComponent(projectId)}/buildings`);
  } catch (err) {
    return;
  }
  const signature = `${data.tier_configured}:${data.buildings.map(b => b.key).join(",")}`;
  if (signature === lastBuildingsSignature) return;
  lastBuildingsSignature = signature;
  populateBuildingSelect(data);

  if (!data.buildings.some(b => b.key === currentBuildingKey)) {
    currentBuildingKey = data.buildings.length ? data.buildings[0].key : null;
  }
}

projectSelect.addEventListener("change", async () => {
  currentProjectId = projectSelect.value;
  currentBuildingKey = null;
  lastBuildingsSignature = null;
  await loadBuildingsForProject(currentProjectId);
  lastPayloadJson = null; // force the next poll tick to render immediately
});

buildingSelect.addEventListener("change", () => {
  currentBuildingKey = buildingSelect.value;
  lastPayloadJson = null; // force the next poll tick to render immediately
});

function updateMeta() {
  if (!currentPayload) return;
  const lvls = levelsForPayload(currentPayload);
  const active = lvls.find(l => l.id === activeLevelId);
  const n = roomsOnLevel(currentPayload, activeLevelId).length;
  const lvlName = active ? active.name : "—";
  meta.textContent = `${lvlName} · ${n} room${n === 1 ? "" : "s"} · v${currentPayload.schema_version} · ${new Date().toLocaleTimeString()}`;
  meta.classList.remove("stale");
}

// Called only when new data arrives.
function ingest(payload) {
  currentPayload = payload;
  empty.classList.add("hidden");

  const levels = levelsForPayload(payload);

  // keep the current level if it still exists, else default to the lowest one
  if (!levels.some(l => l.id === activeLevelId)) {
    activeLevelId = levels.length ? levels[0].id : null;
  }

  buildLevelControl(payload, levels);
  if (activeLevelId) renderLevel(payload, activeLevelId, { refit: true });
  updateMeta();
}

// --- pan & zoom ---
let dragging = false, last = null;
plan.addEventListener("pointerdown", e => { dragging = true; last = { x: e.clientX, y: e.clientY }; plan.setPointerCapture(e.pointerId); });
plan.addEventListener("pointerup", () => dragging = false);
plan.addEventListener("pointermove", e => {
  if (!dragging) return;
  const rect = plan.getBoundingClientRect();
  const dx = (e.clientX - last.x) / rect.width * view.w;
  const dy = (e.clientY - last.y) / rect.height * view.h;
  view.x -= dx; view.y -= dy;
  last = { x: e.clientX, y: e.clientY };
  setViewBox();
});
plan.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = plan.getBoundingClientRect();
  const mx = view.x + (e.clientX - rect.left) / rect.width * view.w;
  const my = view.y + (e.clientY - rect.top) / rect.height * view.h;
  const k = e.deltaY > 0 ? 1.1 : 0.9;
  view.x = mx - (mx - view.x) * k;
  view.y = my - (my - view.y) * k;
  view.w *= k; view.h *= k;
  setViewBox();
}, { passive: false });
plan.addEventListener("dblclick", () => { view = { ...fitted }; setViewBox(); });

// --- polling ---

// Build /rooms's URL from the current project/building selection. Neither
// selected -> today's unscoped "merge everything" behaviour.
function roomsUrl() {
  const params = new URLSearchParams();
  if (currentProjectId) params.set("project", currentProjectId);
  if (currentBuildingKey) params.set("building", currentBuildingKey);
  const qs = params.toString();
  return qs ? `/rooms?${qs}` : "/rooms";
}

async function poll() {
  try {
    const res = await fetch(roomsUrl(), { cache: "no-store" });
    if (res.status === 204) { meta.textContent = "waiting for data"; meta.classList.add("stale"); return; }
    if (!res.ok) throw new Error(res.status);
    const payload = await res.json();
    const incoming = JSON.stringify(payload);
    if (incoming !== lastPayloadJson) {
      lastPayloadJson = incoming;
      ingest(payload);   // re-fits + rebuilds level control only on real change
    }
  } catch (err) {
    meta.textContent = "connection lost"; meta.classList.add("stale");
  }
}

// Each tick: refresh the project/building pickers (cheap, in-memory-derived;
// this is also how a newly-pushed project/building shows up without a page
// reload), then fetch rooms scoped to whatever's currently selected.
async function tick() {
  await loadProjects();
  await poll();
}
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
