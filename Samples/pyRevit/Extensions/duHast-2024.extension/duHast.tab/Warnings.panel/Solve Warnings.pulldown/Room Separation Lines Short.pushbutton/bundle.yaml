# bundle title
title: "Room Lines Overlap Short"

# bundle tooltip
tooltip: | 
  Attempts to fix room separation lines are overlapping warnings. 
  This is done by:
  - modifying the shorter room separation line so that its start point coincides with the end point of the longer line.


# bundle author
author: 
