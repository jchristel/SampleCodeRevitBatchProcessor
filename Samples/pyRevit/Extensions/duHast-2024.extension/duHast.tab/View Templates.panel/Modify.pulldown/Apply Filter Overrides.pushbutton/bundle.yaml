# bundle title
title: "Apply Filter Overrides"

# bundle tooltip
tooltip: |
    Select filters from a source template
    and propagate their override settings to many other templates.
    If a filter is not present at any of the target
    view templates it will be skipped (not added) 
    to the target template


# bundle author
author: 
  - Jan Christel


