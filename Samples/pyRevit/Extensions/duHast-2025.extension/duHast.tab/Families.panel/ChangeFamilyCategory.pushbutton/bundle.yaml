# bundle title
title: "Change Category"

# bundle tooltip
tooltip: | 
  Changes the category of the open family and preserves any of the original subcategories.
  Elements assigned to the original subcategories will be reassigned to the new subcategories after the category change.


# bundle author
author: 
  - Jan Christel


# bundle highlighting ('new' or 'updated')
# Revit UI will show a orange marker on the button and a border around the tooltip
#highlight: new      # highlight as new
#highlight: updated  # highlight as updated


