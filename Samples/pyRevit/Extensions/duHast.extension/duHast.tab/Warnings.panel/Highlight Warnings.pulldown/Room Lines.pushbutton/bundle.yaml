# bundle title
title: "Report Room Lines with Warnings"

# bundle tooltip
tooltip: | 
  Lists all room lines with warnings:
  - design option they belong to
  - the level they are placed on
  - phase created
  To make it easier to find them in the model.


# bundle author
author: 
  - Jan Christel


# bundle highlighting ('new' or 'updated')
# Revit UI will show a orange marker on the button and a border around the tooltip
#highlight: new      # highlight as new
highlight: updated  # highlight as updated


