# bundle title
title: "Copy And Rename Families in Folder"

# bundle tooltip
tooltip:  | 
  Copies and renames families based on a csv file. The csv file needs to have a header row and the following columns 
  
  - 0 the current family name
  - 1 File path ( this column can stay empty )
  - 2 The revit catgeory i.e. Furniture
  - 3 the new family name
  - 4 the new folder path (optional, if blank copy will be created in the same folder as the original)


# bundle author
author: 
