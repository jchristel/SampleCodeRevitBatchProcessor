# bundle title
title: "Add & Apply Filter Overrides to Views"

# bundle tooltip
tooltip: |
    Select filters from a source view
    and add them and their override settings to many other views.
    If a filter is not present at any of the target
    view templates, it will be added to the template.
    Applies to views without templates only.


# bundle author
author: 
  - Jan Christel


